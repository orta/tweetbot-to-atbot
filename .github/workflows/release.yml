name: Release

# Push a `v*` tag -> build Atbotify.app, sign it with the Developer ID, notarize + staple,
# and attach the zip to a GitHub Release. Setup + required secrets: docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no GitHub Release is created for manual runs)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write # create the release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.mjs derives the build number from the commit count

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::APPLE_CERTIFICATE secret is not set (see docs/RELEASING.md)"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # let codesign use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # put it on the search list so `security find-identity` / codesign can see it
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::the .p12 does not contain a Developer ID Application identity"; exit 1; }

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_API_KEY_P8" ] || { echo "::error::APPLE_API_KEY_P8 secret is not set (see docs/RELEASING.md)"; exit 1; }
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"   # stored as the raw PEM text
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarize, staple
        id: build
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/release.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atbotify-${{ steps.build.outputs.version }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.sha256_file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A string, not an array: the runner's /bin/bash is 3.2, where "${arr[@]}" of an
          # empty array is an unbound-variable error under set -u (it broke v0.1.0's publish).
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac   # v1.0.0-beta.1 -> prerelease
          gh release create "$TAG" \
            "${{ steps.build.outputs.zip }}" "${{ steps.build.outputs.sha256_file }}" \
            --title "Atbotify ${{ steps.build.outputs.version }}" \
            --generate-notes --verify-tag $PRERELEASE

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
